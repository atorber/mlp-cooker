openapi: 3.0.3
info:
  title: 百度云API网关
  description: |
    统一百舸各模块API规范和数据结构的中间层网关服务。

    所有接口采用RPC风格，通过 `?action=XXX` 参数区分操作。
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://localhost:3000/v1
    description: 本地开发服务器
tags:
  - name: BOS
    description: BOS 对象存储接口
  - name: Jobs
    description: 训练任务接口
  - name: Services
    description: 服务部署接口
  - name: DevInstances
    description: 开发机接口
  - name: Datasets
    description: 数据集接口
  - name: Models
    description: 模型管理接口
  - name: ResourcePools
    description: 资源池接口
paths:
  /aihc/jobs/DescribeJobs:
    get:
      tags:
        - Jobs
      summary: Jobs - DescribeJobs
      description: 查询指定资源池和队列下的训练任务列表
      operationId: describeJobs
      parameters:
        - $ref: "#/components/parameters/RegionParam"
        - $ref: "#/components/parameters/AkParam"
        - $ref: "#/components/parameters/SkParam"
        - name: resourcePoolId
          in: query
          required: true
          schema:
            type: string
          description: 资源池ID
        - name: queue
          in: query
          schema:
            type: string
          description: 队列名称
        - name: status
          in: query
          schema:
            type: string
          description: 任务状态过滤
        - name: keyword
          in: query
          schema:
            type: string
          description: 搜索关键字
        - name: pageNumber
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
  /aihc/jobs/DescribeJob:
    get:
      tags:
        - Jobs
      summary: Jobs - DescribeJob
      description: 查询指定资源池和队列下的训练任务列表
      operationId: describeJob
      parameters:
        - $ref: "#/components/parameters/RegionParam"
        - $ref: "#/components/parameters/AkParam"
        - $ref: "#/components/parameters/SkParam"
        - name: resourcePoolId
          in: query
          required: true
          schema:
            type: string
          description: 资源池ID
        - name: queue
          in: query
          schema:
            type: string
          description: 队列名称
        - name: jobId
          in: query
          schema:
            type: string
          description: 任务ID（DescribeJob时必填）
        - name: needDetail
          in: query
          schema:
            type: boolean
          description: 是否需要详情（DescribeJob时可选）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
  /aihc/jobs/CreateJob:
    post:
