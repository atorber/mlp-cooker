components:
  parameters:
    RegionParam:
      name: region
      in: header
      required: true
      description: 区域代码
      schema:
        type: string
        enum:
          - bj
          - gz
          - su
          - bd
          - fwh
          - yq
        default: bd
    AkParam:
      name: ak
      in: header
      required: true
      description: 百度云 Access Key
      schema:
        type: string
    SkParam:
      name: sk
      in: header
      required: true
      description: 百度云 Secret Key
      schema:
        type: string
  schemas:
    Pagination:
      type: object
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
    ComputeResources:
      type: object
      required:
        - cpu
        - memory
      properties:
        cpu:
          type: number
          description: CPU核数
        memory:
          type: number
          description: 内存(GB)
        accelerator:
          type: object
          properties:
            type:
              type: string
              description: 加速卡类型
            count:
              type: integer
              description: 加速卡数量
        sharedMemory:
          type: number
          description: 共享内存(GB)
    ResourcePoolRef:
      type: object
      required:
        - poolId
        - queue
      properties:
        poolId:
          type: string
          description: 资源池ID
        poolName:
          type: string
          description: 资源池名称
        poolType:
          type: string
          enum:
            - common
            - dedicatedV2
        queue:
          type: string
          description: 队列名称
    ImageConfig:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: 镜像地址
        source:
          type: string
          enum:
            - preset
            - custom
            - ccr
        auth:
          type: object
          properties:
            username:
              type: string
            password:
              type: string
    StorageMount:
      type: object
      required:
        - name
        - mountPath
        - storageType
        - config
      properties:
        name:
          type: string
        mountPath:
          type: string
        readOnly:
          type: boolean
        storageType:
          type: string
          enum:
            - pfs
            - bos
            - cfs
            - dataset
            - hostPath
            - emptyDir
            - cds
        config:
          type: object
    CreateJobRequest:
      type: object
      required:
        - name
        - resourcePool
        - command
        - resources
        - replicas
        - image
      properties:
        name:
          type: string
        resourcePool:
          $ref: "#/components/schemas/ResourcePoolRef"
        framework:
          type: string
          enum:
            - PyTorchJob
            - TFJob
            - MPIJob
        command:
          type: string
        resources:
          $ref: "#/components/schemas/ComputeResources"
        replicas:
          type: integer
        image:
          $ref: "#/components/schemas/ImageConfig"
        storageMounts:
          type: array
          items:
            $ref: "#/components/schemas/StorageMount"
        envs:
          type: object
          additionalProperties:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        priority:
          type: string
          enum:
            - high
            - normal
            - low
        enableRDMA:
          type: boolean
    DeleteJobRequest:
      type: object
      required:
        - resourcePoolId
        - queue
        - jobId
      properties:
        resourcePoolId:
          type: string
        queue:
          type: string
        jobId:
          type: string
    CreateJobResponse:
      type: object
      properties:
        requestId:
          type: string
        jobId:
          type: string
        jobName:
          type: string
    DeleteJobResponse:
      type: object
      properties:
        requestId:
          type: string
        jobId:
          type: string
    JobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            type: object
        pagination:
          $ref: "#/components/schemas/Pagination"
    JobDetail:
      type: object
      properties:
        jobId:
          type: string
        jobName:
          type: string
        status:
          type: string
        resourcePool:
          $ref: "#/components/schemas/ResourcePoolRef"
        framework:
          type: string
        command:
          type: string
        resources:
          $ref: "#/components/schemas/ComputeResources"
        replicas:
          type: integer
        image:
          $ref: "#/components/schemas/ImageConfig"
        envs:
          type: object
          additionalProperties:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string
        priority:
          type: string
        enableRDMA:
          type: boolean
    CreateServiceRequest:
      type: object
      properties:
        name:
          type: string
          description: 服务名称
        resourcePool:
          $ref: "#/components/schemas/ResourcePoolRef"
          description: 资源池引用
        instanceCount:
          type: integer
          description: 实例数量
        workloadType:
          type: string
          description: 工作负载类型 (e.g., job, deployment)
        acceleratorType:
          type: string
          description: 加速卡类型 (e.g., nvidia-a100)
        containers:
          type: array
          description: 容器信息集合
          items:
            type: object
            properties:
              name:
                type: string
                description: 容器名称
              resources:
                $ref: "#/components/schemas/ComputeResources"
                description: 计算资源
              image:
                $ref: "#/components/schemas/ImageConfig"
                description: 镜像配置
              command:
                type: array
                items:
                  type: string
                description: 启动命令
              ports:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    port:
                      type: integer
              envs:
                type: object
                additionalProperties:
                  type: string
                description: 环境变量KV字典
        storageMounts:
          type: array
          description: 存储挂载
          items:
            $ref: "#/components/schemas/StorageMount"
        access:
          type: object
          additionalProperties: true
          description: 访问权限与网络配置（直通透传）
        deploy:
          type: object
          additionalProperties: true
          description: 部署策略配置（直通透传）
        log:
          type: object
          additionalProperties: true
          description: 日志配置（直通透传）
        misc:
          type: object
          additionalProperties: true
          description: 杂项配置(podAnnotations等)（直通透传）
    DeleteServiceRequest:
      type: object
      required:
        - serviceId
      properties:
        serviceId:
          type: string
    ServiceListResponse:
      type: object
      properties:
        services:
          type: array
          items:
            type: object
        pagination:
          $ref: "#/components/schemas/Pagination"
    ServiceDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        resourcePool:
          $ref: "#/components/schemas/ResourcePoolRef"
        instanceCount:
          type: integer
        containers:
          type: array
          items:
            type: object
    CreateDevInstanceRequest:
      type: object
      properties:
        name:
          type: string
        resourcePool:
          $ref: "#/components/schemas/ResourcePoolRef"
        resources:
          $ref: "#/components/schemas/ComputeResources"
        image:
          $ref: "#/components/schemas/ImageConfig"
    DeleteDevInstanceRequest:
      type: object
